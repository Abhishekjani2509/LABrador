<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>DRUGGABILITY DOSSIER — PIPELINE STATE</title>
    <style>
    :root {
      --bg: #d7d2ac;
      --ink: #1a1a1a;
      --ink-70: rgba(26, 26, 26, 0.7);
      --ink-45: rgba(26, 26, 26, 0.45);
      --ink-22: rgba(26, 26, 26, 0.22);
      --ink-12: rgba(26, 26, 26, 0.12);
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
    }
    body {
      min-width: 1180px;
      font-family: var(--mono);
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
    }
    a {
      color: inherit;
    }

    /* ---------- header ---------- */
    header {
      display: flex;
      gap: 32px;
      align-items: flex-end;
      justify-content: space-between;
      padding: 12px 18px 10px 18px;
      border-bottom: 2px solid var(--ink);
    }
    .h-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .h-sub {
      max-width: 500px;
      margin-top: 3px;
      font-size: 11px;
      color: var(--ink-70);
      letter-spacing: 0.05em;
    }
    .counts {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--ink);
    }
    .count {
      min-width: 66px;
      padding: 5px 9px 6px 9px;
      text-align: center;
      border-right: 1px solid var(--ink);
    }
    .count:last-child {
      border-right: 0;
    }
    .count .n {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
    }
    .count .k {
      font-size: 9px;
      color: var(--ink-70);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
    .count.tot {
      background: var(--ink);
    }
    .count.tot .n {
      color: var(--bg);
    }
    .count.tot .k {
      color: rgba(215, 210, 172, 0.75);
    }

    /* ---------- layout ---------- */
    .wrap {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 340px;
      align-items: stretch;
      height: calc(100vh - 62px);
      min-height: 720px;
    }
    .col {
      overflow-x: hidden;
      overflow-y: auto;
    }
    .col::-webkit-scrollbar {
      width: 9px;
    }
    .col::-webkit-scrollbar-thumb {
      background: var(--ink-22);
    }
    .col::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ---------- sidebar ---------- */
    #sidebar {
      border-right: 1px solid var(--ink);
    }
    .side-head {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      padding: 9px 12px 8px 12px;
      font-size: 9.5px;
      color: var(--ink-70);
      letter-spacing: 0.16em;
      background: var(--bg);
      border-bottom: 1px solid var(--ink);
    }
    .grp {
      border-bottom: 1px solid var(--ink-22);
    }
    .grp-head {
      padding: 9px 12px 2px 12px;
    }
    .grp-name {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }
    .grp-note {
      margin-top: 1px;
      font-size: 9.5px;
      line-height: 1.4;
      color: var(--ink-45);
      letter-spacing: 0.02em;
    }
    .grp-rows {
      padding: 5px 0 8px 0;
    }
    .row {
      display: grid;
      grid-template-columns: 22px 1fr 26px;
      gap: 6px;
      align-items: start;
      padding: 2.5px 12px 2.5px 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    .row .code {
      height: 15px;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 14px;
      text-align: center;
      border: 1px solid var(--ink-45);
    }
    .row .nm {
      font-size: 10.5px;
      line-height: 1.35;
      color: var(--ink);
      letter-spacing: -0.2px;
      overflow-wrap: anywhere;
    }
    .row .tg {
      font-size: 8.5px;
      line-height: 1.5;
      color: var(--ink-45);
      text-align: right;
      letter-spacing: 0.06em;
    }
    .row.wdr .nm {
      color: var(--ink-45);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .row:hover {
      background: var(--ink-12);
    }
    .row.sel {
      background: var(--ink);
      border-left-color: var(--ink);
    }
    .row.sel.wdr .nm {
      color: rgba(215, 210, 172, 0.7);
    }
    .row.sel .nm,
    .row.sel .tg {
      color: var(--bg);
    }
    .row.sel .code {
      color: var(--bg);
      border-color: var(--bg);
    }
    .row.dim {
      opacity: 0.38;
    }

    /* ---------- diagram ---------- */
    #stage {
      position: relative;
    }
    #diagram {
      display: block;
      width: 100%;
      height: auto;
    }
    .dg-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 26px;
      align-items: flex-start;
      padding: 9px 18px 16px 18px;
      border-top: 1px solid var(--ink-22);
    }
    .lg-item {
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }
    .lg-item .lt {
      max-width: 150px;
      font-size: 9.5px;
      line-height: 1.35;
      color: var(--ink-70);
    }
    .lg-item .lt b {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.07em;
    }

    /* ---------- right panel ---------- */
    /* min-height:0 on both the grid item and the flex child, or .p-body grows to
                       its content instead of scrolling and the tail of a long panel is unreachable */
    #panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-left: 1px solid var(--ink);
    }
    .tabs {
      display: flex;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--ink);
    }
    .tab {
      flex: 1;
      padding: 9px 6px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--ink-45);
      text-align: center;
      letter-spacing: 0.14em;
      cursor: pointer;
      background: transparent;
      border-right: 1px solid var(--ink);
    }
    .tab:last-child {
      border-right: 0;
    }
    .tab.on {
      font-weight: 700;
      color: var(--bg);
      background: var(--ink);
    }
    .p-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 16px 18px 30px 18px;
      overflow-y: auto;
    }
    .p-body::-webkit-scrollbar {
      width: 9px;
    }
    .p-body::-webkit-scrollbar-thumb {
      background: var(--ink-22);
    }
    .p-code {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .p-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .p-stage {
      margin-top: 5px;
      font-size: 9.5px;
      color: var(--ink-45);
      letter-spacing: 0.14em;
    }
    .p-rule {
      margin: 13px 0 12px 0;
      border: 0;
      border-top: 1px solid var(--ink);
    }
    .p-rule.thin {
      border-top: 1px solid var(--ink-22);
    }
    .p-kicker {
      margin-bottom: 6px;
      font-size: 9px;
      color: var(--ink-45);
      letter-spacing: 0.17em;
    }
    .p-text {
      font-size: 12px;
      line-height: 1.62;
    }
    .p-text + .p-text {
      margin-top: 10px;
    }
    .p-status {
      display: inline-block;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      border: 1px solid var(--ink);
    }
    .p-status.neg {
      color: var(--bg);
      background: var(--ink);
    }
    .p-meta {
      margin-top: 14px;
      font-size: 10px;
      line-height: 1.6;
      color: var(--ink-45);
      letter-spacing: 0.05em;
    }
    .p-hint {
      margin-top: 22px;
      font-size: 9.5px;
      color: var(--ink-45);
      letter-spacing: 0.1em;
    }
    .p-list {
      padding: 0;
      margin: 8px 0 0 0;
      list-style: none;
    }
    .p-list li {
      position: relative;
      padding-left: 13px;
      font-size: 11px;
      line-height: 1.55;
      color: var(--ink-70);
    }
    .p-list li:before {
      position: absolute;
      top: 7px;
      left: 0;
      width: 5px;
      height: 5px;
      content: "";
      border: 1px solid var(--ink-45);
      transform: rotate(45deg);
    }
    /* scoped to .p-body only to out-specify .lg-item .lt b above; the two never
                   match the same element, but the cascade order would otherwise descend */
    .p-body .p-list li b {
      font-weight: 700;
      color: var(--ink);
    }

    /* svg text defaults */
    #diagram text {
      font-family: var(--mono);
      fill: var(--ink);
    }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="h-title">DRUGGABILITY DOSSIER &mdash; PIPELINE STATE</div>
        <div class="h-sub">
          Small-molecule tractability station. Isometric schematic: block height
          &prop; verification work behind the component; block fill &prop; build
          status.
        </div>
      </div>
      <div class="counts" id="counts"></div>
    </header>

    <div class="wrap">
      <nav class="col" id="sidebar"></nav>
      <section class="col" id="stage">
        <svg
          id="diagram"
          shape-rendering="geometricPrecision"
          xmlns="http://www.w3.org/2000/svg"
        >
          <title>
            Isometric schematic of the druggability pipeline: one block per
            component, grouped into stage columns.
          </title>
        </svg>
        <div class="dg-foot" id="legend"></div>
      </section>
      <aside id="panel">
        <div class="tabs">
          <button class="tab on" data-tab="what" type="button">
            WHAT IT DOES
          </button>
          <button class="tab" data-tab="status" type="button">STATUS</button>
        </div>
        <div class="p-body" id="pbody"></div>
      </aside>
    </div>

    <script>
    "use strict";
    /* ============================================================================
                   DATA  —  edit this array to update the schematic. Everything below renders
                   from it: the diagram, the sidebar index, the header counts, the panel.

                   stage     : key into STAGES
                   status    : 'verified' | 'built' | 'deploying' | 'partial' | 'notbuilt'
                               | 'withdrawn' | 'blocked'   (controls block fill + sidebar tag)
                   label     : the exact status string, shown verbatim. Never inferred.
                   h         : block height in world units = how much verification work sits
                               behind the component. 6 (nothing measured) .. 68 (counterexample
                               found, fixed, and re-tested).
                   caveat    : true -> draws the open-diamond marker on the top face
                   corrected : true -> this component gave a wrong answer, and was corrected.
                               Draws the solid-square marker, and an asterisk in the index.
                               The distinction from "built right first time" is the single
                               most informative thing on the schematic — do not drop it.
                   ========================================================================= */

    const STAGES = [
      {
        key: "graph",
        n: "00",
        name: ["GRAPH", "INTAKE"],
        note: "A whole stage upstream of 01, and it was missing from earlier versions of this schematic. graph_read.py, pure stdlib, five fixtures. It is also the only place in the pipeline that talks BACK upstream — four ask verbs, five conjunctive gates, a handful of firings a year.",
        title: "GRAPH INTAKE",
      },
      { key: "input", n: "01", name: ["INPUT"], note: "", title: "INPUT" },
      {
        key: "prec",
        n: "02",
        name: ["PRECEDENT", "AXIS"],
        note: "Paperclip CLI + chembl_v / pdb_v / uniprot_v SQL views, ~24M bioactivities",
        title: "PRECEDENT AXIS",
      },
      {
        key: "struct",
        n: "03",
        name: ["STRUCTURE", "SELECTION"],
        note: "",
        title: "STRUCTURE SELECTION",
      },
      {
        key: "pocket",
        n: "04",
        name: ["POCKET", "ANALYSIS"],
        note: "Modal app druggability-pocket-scan · CPU · deployed. cryptic_analysis.py, interface_analysis.py and disorder.py are now wired into the app rather than run by hand, and mdpocket has replaced the residue-number site matcher outright. VOLUME LEADS THIS AXIS; druggability is a range beside it and never a verdict — see E6.",
        title: "POCKET ANALYSIS",
      },
      {
        key: "escal",
        n: "05",
        name: ["ESCALATION"],
        note: "GPU, deployed to Modal (workspace rafwiewiora) and smoke-tested, and now with code in this checkout: .claude/skills/cofold-check/predict.py wraps all four tools. Everything here runs DOWNSTREAM of pocket detection. But the column ends one rung short — BioEmu frames cannot enter pocket detection without side-chain repacking, and nothing repacks them, so the escalation ladder is blocked at U2.",
        title: "ESCALATION",
      },
      {
        key: "synth",
        n: "06",
        name: ["SYNTHESIS"],
        note: "",
        title: "SYNTHESIS",
      },
      /* name[] is written with textContent (raw), title is written with innerHTML */
      {
        detached: true,
        key: "eval",
        n: "E",
        name: ["EVALUATION", "& FALSIFICATION"],
        note: "Sits beside the pipeline, not in it. These components measure the pipeline, not a target: fixtures it is calibrated against, retrospective runs at past cutoff dates, and destroyed-site controls run against our own tools to find out where they lie.",
        title: "EVALUATION &amp; FALSIFICATION",
      },
    ];

    const DATA = [
      /* ---- GRAPH INTAKE -------------------------------------------------------- */
      {
        code: "0A",
        h: 44,
        label: "BUILT — GRADED AGAINST FIXTURES",
        name: "upstream evidence graph → input contract",
        st: "Built as its own stage, because it is one: it sits upstream of 01 and earlier versions of this schematic did not draw it at all. graph_read.py is 623 lines of pure stdlib and runs in the sandbox with nothing installed. Five fixtures back it, including an unknown-verb case, an edge-case set and an expected-output grading key. IRAK4 is the case it exists for: four links say two different things — kinase activity in three of them, signalosome scaffolding in the fourth — and no single link says so. That only appears when the whole neighbourhood is read at once, which is the entire argument for reading a graph instead of a row.",
        stage: "graph",
        status: "built",
        what: "Reads the upstream literature evidence graph — things, links, findings, papers, gaps, rounds, coverage — and extracts the input contract from it. Step 0 is reading the graph's own status field (ok / empty / partial / failed) before anything else, because a partial graph and an empty one are different inputs and only one of them is a gap. Nomination is conjunctive: the node must be a protein or a gene, AND be either the object of a direct-action edge from a small molecule or named in a gaps[].missing pair. It does not assess tractability, does not decide an unstated mechanism, and never treats a computed result as literature evidence.",
      },

      {
        caveat: true,
        code: "0B",
        h: 38,
        label: "BUILT — GATED, NARROW BY DESIGN",
        name: "ask-back to the graph",
        st: "Real, and deliberately narrow. Five conjunctive gates, all five, no exceptions — four is not enough. (1) It changes a dossier value. (2) Its support is secondary-only: link basis background_only or hedged_only, never primary or mixed. (3) We tried, we failed, and the failures are written down — ChEMBL, registry, structure and an exact-identifier grep all run, all abstained, each null in not_found BEFORE the ask is drafted. That gate does all the work. (4) There is a row to point at and nobody has asked yet. (5) There is literature left to find. Its author then tested the trigger against the four cases that motivated it and found every one answerable inside our own pipeline — obefazimod from chembl.drug_mechanism in 6 ms, both trial cases from ctgov.studies in 418 ms, and the IRAK4 efficacy claim not a tractability question at all under rule 7. Only one of the four fires the rule, and then only as a non-blocking post-resolution ask. The justification set was mostly our own unfinished lookups, and this is expected to fire a handful of times a year. Open caveat: graph_read.py --check-ask enforces gates 2, 4 and 5; gates 1 and 3 are still on the operator.",
        stage: "graph",
        status: "built",
        what: "The one arrow on this diagram that points upstream. Four ask verbs and there is no fifth — expand_node, resolve_link, test_gap, new_question — one ask per request, one round per request, each pointing at an existing row by id and carrying at least two source identifiers. It sends QUESTIONS back to the knowledge graph. It never sends computed results back as literature evidence, and an outstanding ask never blocks a verdict.",
      },

      /* ---- INPUT --------------------------------------------------------------- */
      {
        code: "A",
        h: 40,
        label: "BUILT",
        name: "target accession + mechanism contract",
        st: "IRAK4 retired the old wording. The same accession returns small_molecule_tractable for the kinase site and insufficient_evidence for the Myddosome scaffolding mode, and the two runs share ZERO residues. An earlier version of this block read “the only required input is a UniProt accession” — true about what is required, false about what determines the answer, and the diagram carried it as if it were the whole contract. Chain selection is now directly expressible too: pocket_scan takes chains and site_residues, so rule 2b runs through the deployed app instead of degrading to whole-assembly scoring the way every earlier run did.",
        stage: "input",
        status: "built",
        what: "A UniProt accession is the only REQUIRED field, and it is not the whole contract. Four optional fields ride along and two of them change the answer. as_of_date re-runs the whole pipeline as it would have looked on a past date. disease_context selects clinical precedent and never adjusts a number. interaction_to_disrupt names what the molecule is meant to stop. mechanism_hypothesis — orthosteric, allosteric, oligomer_destabilisation or unknown — decides which chains constitute the site. The last two are not preferences: they select the chains that get scored, and therefore they select the verdict.",
      },

      /* ---- PRECEDENT AXIS ------------------------------------------------------ */
      {
        code: "B",
        h: 56,
        label: "BUILT AND VERIFIED",
        name: "drugs by accession",
        st: "Verified against the rheumatoid arthritis fixture set, where the expected answer per target is known independently.",
        stage: "prec",
        status: "verified",
        what: "Pulls approved and clinical-stage drugs recorded against the accession, each with its first_approval year and annotated mechanism, out of the ChEMBL views exposed by the Paperclip CLI.",
      },

      {
        code: "C",
        corrected: true,
        h: 66,
        label: "BUILT AND VERIFIED",
        name: "modality test",
        st: "Corrected after a wrong answer. The first test read canonical_smiles IS NULL as “biologic”, and it could not discriminate: salt forms read as biologics, nine EGFR drugs looked like biologics when only four are. molecule_type calls all four JAK1 salt forms Small molecule and needs no confirmation step — 11 of 11 JAK1 rows, all TNF and IL-17A approvals correct.",
        stage: "prec",
        status: "verified",
        what: "Decides small molecule versus biologic per drug, from an explicit modality field — chembl.molecule_dictionary.molecule_type — rather than from a label or from an absent chemical structure. This gate runs before any precedent claim, because an approved antibody is not evidence that a small molecule is possible.",
      },

      {
        code: "D",
        h: 68,
        label: "BUILT AND VERIFIED",
        name: "assay provenance",
        st: "Caught exactly the failure it was written for. 45% of TNF-alpha’s bioactivity comes from an IRAK4 assay measuring a different protein, and it is labelled assay_type=’B’, so the obvious assay_type filter does not remove it.",
        stage: "prec",
        status: "verified",
        what: "Groups bioactivity rows by assay_description and flags any target whose measured activity is dominated by a single assay — threshold, one assay exceeding 30% of the rows.",
      },

      {
        code: "E",
        h: 46,
        label: "BUILT AND VERIFIED",
        name: "compounds and potency",
        st: "Verified. Reads through the same views as B and D, so it inherits the provenance flag from D rather than reporting potency naked.",
        stage: "prec",
        status: "verified",
        what: "Distinct compound count against the accession, and the best pchembl value observed — the two blunt numbers that say whether anyone has ever made anything that binds.",
      },

      {
        code: "F",
        h: 32,
        label: "PARTIAL",
        name: "patents and trials (full-text retrieval)",
        st: "Verified working, not yet wired into a run. Named compounds must be found with grep, never semantic search: LY3509754 returned 0 relevant hits semantically; grep returned 13 papers. Patents are unavailable at the source — Paperclip answers “Patents sources are not available.” — so patents.count is null by contract rather than by omission, and rule 13 requires the reason in not_found. This block used to claim terminated programs as well; F2 now carries that, and F is narrower and more honest for it.",
        stage: "prec",
        status: "partial",
        what: "Full-text retrieval across patents, trial records and literature via Paperclip grep — the part of the precedent record that structured databases do not carry.",
      },

      {
        code: "F2",
        h: 54,
        label: "BUILT — SIXTEEN FAILURE MODES NAMED",
        name: "terminated programs",
        st: "The largest single file in this station, 1,090 lines, and almost all of it is failure modes — SIXTEEN, F1 through F16. The ones that bite: a terminated trial with a NULL why_stopped is the most misleading state in the table, not the least informative; why_stopped is about 95% noise and must never carry a target verdict alone; newer papers routinely carry older facts, so a review can invert a program's status; withdrawn is not failed; the trial that was never registered does not appear at all; the primary trial report is usually outside the corpus; strings truncate silently at 250 characters; a semantic search for a drug code returns confident, wholly irrelevant hits; and counting trials when you mean programs inflates everything. Block F used to cover this whole area in one line about grep. It could not, and the diagram was stale against the file.",
        stage: "prec",
        status: "built",
        what: "Retrieves WHY clinical programs stopped — ctgov.studies.why_stopped joined to the literature by exact-string grep on drug codes, never semantic search — and reports contradictory sources side by side with their dates instead of reconciling them. It does not score druggability and it does not decide a target is dead. Rule 7: clinical failure is not evidence against tractability. RORgt is the standing case — 152 holo structures, 12,900 compounds, 0.1 nM potency, zero approvals, VTP-43742 stopped on transaminase elevations and TAK-828F on preclinical teratogenicity. Small-molecule tractable AND clinically failed, both recorded, neither discounting the other.",
      },

      /* ---- STRUCTURE SELECTION ------------------------------------------------- */
      {
        code: "G",
        h: 58,
        label: "BUILT AND VERIFIED",
        name: "PDB structures by accession",
        st: "Verified. release_date is 100% populated across all 508,687 rows, which is what makes the as-of filter downstream safe rather than silently lossy.",
        stage: "struct",
        status: "verified",
        what: "Every PDB entry mapped to the accession, carrying release_date.",
      },

      {
        code: "H",
        corrected: true,
        h: 68,
        label: "BUILT AND VERIFIED",
        name: "biological assembly",
        st: "Verified by counterexample. 9SQX’s ASU holds two biological dimers; scoring all four chains fused them into one object and the real ligand site fell to rank 9. On assembly1 it is rank 1.",
        stage: "struct",
        status: "verified",
        what: "Fetches &lt;ID&gt;-assembly1.cif, never the asymmetric unit, so pockets are scored on the biological oligomer that actually exists in solution.",
      },

      {
        code: "I",
        corrected: true,
        h: 62,
        label: "BUILT AND VERIFIED",
        name: "holo/apo by ligand chemistry",
        st: "Verified. The denylist is load-bearing, not cosmetic: GDP is 28 heavy atoms, so apo KRAS would otherwise be classified holo and the whole cryptic-pocket comparison would invert.",
        stage: "struct",
        status: "verified",
        what: "Classifies each structure holo or apo from the chemistry of what is bound — a heavy-atom threshold plus a denylist of cofactors and crystallisation additives.",
      },

      {
        code: "J",
        h: 42,
        label: "BUILT AND VERIFIED",
        name: "as-of date filter",
        st: "Verified, and scoped honestly: it works for structures, on release_date. It is not claimed for any other evidence type.",

    /* --- connectors: intra-stage rails + inter-stage spine -------------------- */
    function diamond(x, y, r, filled) {
      return el("path", {
        d: `M ${x} ${y - r} L ${x + r} ${y} L ${x} ${y + r} L ${x - r} ${y} Z`,
        fill: filled ? "#1a1a1a" : "#d7d2ac",
        stroke: "#1a1a1a",
        "stroke-width": 1,
      });
    }
    function arrow(x, y, r) {
      return el("path", {
        d: `M ${x} ${y} L ${x - r * 1.5} ${y - r * 0.8} L ${x - r * 1.5} ${y + r * 0.8} Z`,
        fill: "#1a1a1a",
        stroke: "none",
      });

    /* status decoration shared by the blocks and the legend swatches.
                   BLOCKED  — heavy front edges + solid joint at the front corner.
                   WITHDRAWN — struck front faces. A retracted finding, not an unbuilt one. */
    function decorate(g, status, T, B, scale) {
      const k = scale || 1;
      if (status === "blocked") {
        g.appendChild(
          el("path", {
            d: `M ${T.W[0]} ${T.W[1]} L ${T.S[0]} ${T.S[1]} L ${T.E[0]} ${T.E[1]}`,
            fill: "none",
            stroke: "#1a1a1a",
            "stroke-linejoin": "miter",
            "stroke-width": 3.4 * k,
          })
        );
        g.appendChild(diamond(T.S[0], T.S[1], 4.6 * k, true));
      }
      if (status === "withdrawn") {
        const strike = (a, b) =>
          el("line", {
            stroke: "#1a1a1a",
            "stroke-linecap": "butt",
            "stroke-width": 1.9 * k,
            x1: a[0],
            x2: b[0],
            y1: a[1],
            y2: b[1],
          });
        g.appendChild(strike(T.W, B.S)); // left face  \
        g.appendChild(strike(T.S, B.W)); // left face  /
        g.appendChild(strike(T.E, B.S)); // right face /
        g.appendChild(strike(T.S, B.E)); // right face \
      }
    }
    for (const [si, s] of STAGES.entries()) {
      const list = byStage[s.key];
      const X = stageX[s.key];
      /* vertical rail through the column, behind the blocks */
      for (let r = 0; r < list.length - 1; r += 1) {
        const yA = r * VY + L * S30;
        const yB = (r + 1) * VY - L * S30 - list[r + 1].h;
        gLink.appendChild(
          el("line", {
            stroke: "#1a1a1a",
            "stroke-opacity": 0.75,
            "stroke-width": 1.1,
            x1: X,
            x2: X,
            y1: r * VY,
            y2: (r + 1) * VY,
          })
        );
        if (yB - yA > 11) {
          gLink.appendChild(diamond(X, (yA + yB) / 2, 3.6, false));
        }
      }
      /* horizontal spine to the next stage, at row 0 ground level */
      const next = STAGES[si + 1];
      if (next && !next.detached) {
        const x1 = X + L * C30,
          x2 = stageX[next.key] - L * C30;
        gLink.appendChild(
          el("line", {
            stroke: "#1a1a1a",
            "stroke-width": 1.3,
            x1,
            x2: x2 - 6,
            y1: 0,
            y2: 0,
          })
        );
        gLink.appendChild(diamond((x1 + x2) / 2, 0, 4.2, false));
        /* arrowhead: evidence flows downstream. The ONE exception is the
                       graph ask-back, drawn separately below as a narrow return path. */
        gLink.appendChild(arrow(x2, 0, 5));
      }
    }

    /* --- the one upstream arrow: the graph ask-back ---------------------------
           Drawn thin, dashed and below the spine on purpose. Four ask verbs, five
           conjunctive gates, a handful of firings a year — it must not read as a
           feedback loop the pipeline leans on. Everything else is one-way. */
    (function askBack() {
      const from = stageX.input;
      const to = stageX.graph;
      if (from === undefined || to === undefined) {
        return;
      }
      const yb = 34;
      const xa = from - L * C30;
      const xb = to + L * C30 + 7;
      gLink.appendChild(
        el("path", {
          d: `M ${xa} 0 L ${xa} ${yb} L ${xb} ${yb}`,
          fill: "none",
          stroke: "#1a1a1a",
          "stroke-dasharray": "3 3",
          "stroke-opacity": 0.7,
          "stroke-width": 0.9,
        })

      const head = arrow(xb, yb, 4);
      head.setAttribute("transform", `rotate(180 ${xb} ${yb})`);
      head.setAttribute("fill-opacity", 0.7);

      const t = el("text", {
        "fill-opacity": 0.6,
        "font-size": 8,
        "letter-spacing": 0.7,
        "text-anchor": "middle",

      });

    })();

    /* --- standing notes under a stage header. ESCALATION being downstream is a
                   correction, not a layout note; EVALUATION measures the pipeline, not a target. */
    (function stageNotes() {
      const NOTES = {
        escal: [

    /* --- blocks --------------------------------------------------------------- */
    const nodeEls = {};

    function facePath(pts) {
      return `M ${pts.map((p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(" L ")} Z`;
    }

    for (const d of DATA) {
      const { wx, wy, h } = d;
      const half = L / 2;
      const T = {
        // top face corners, z = h
        E: P(wx + half, wy - half, h),
        N: P(wx - half, wy - half, h),
        S: P(wx + half, wy + half, h),
        W: P(wx - half, wy + half, h),
      };
      const B = {
        // base corners, z = 0
        E: P(wx + half, wy - half, 0),
        N: P(wx - half, wy - half, 0),
        S: P(wx + half, wy + half, 0),
        W: P(wx - half, wy + half, 0),
      };
      const faces = {
        left: [T.W, T.S, B.S, B.W],
        right: [T.S, T.E, B.E, B.S],
        top: [T.N, T.E, T.S, T.W],
      };

      const g = el("g", { class: "block", "data-code": d.code, tabindex: "0" });
      const meta = STATUS_META[d.status];
      const ol = OUTLINE[d.status] || { dash: null, w: 1.5 };

      for (const [fk, fpts] of Object.entries(faces)) {
        const pth = facePath(fpts);
        /* opaque base so the grid does not read through the block */
        g.appendChild(el("path", { d: pth, fill: "#d7d2ac", stroke: "none" }));
        if (FACES[fk].tint > 0) {
          g.appendChild(
            el("path", {
              d: pth,
              fill: "#1a1a1a",
              "fill-opacity": FACES[fk].tint,
              stroke: "none",
            })
          );
        }
        if (meta.hatch) {
          g.appendChild(
            el("path", {
              d: pth,
              fill: `url(#h-${d.status}-${fk})`,
              stroke: "none",
            })
          );
        }
        g.appendChild(
          el("path", {
            d: pth,
            fill: "none",
            stroke: "#1a1a1a",
            "stroke-dasharray": ol.dash,
            "stroke-linejoin": "miter",
            "stroke-width": ol.w,
          })

      }

      decorate(g, d.status, T, B, 1);

      /* top-face markers, below the letter and clear of the glyph.
                     open diamond = open caveat.  solid square = corrected after a wrong answer. */
      const marks = [];
      if (d.caveat) {
        marks.push("caveat");
      }
      if (d.corrected) {
        marks.push("corrected");
      }
      /* two markers straddle the centre; a lone marker sits on it */
      const markSpread = marks.length > 1 ? 7 : 0;
      for (const [i, mk] of marks.entries()) {
        const mx = d.apex[0] + (i === 0 ? -markSpread : markSpread);
        const my = d.apex[1] + 17;
        if (mk === "caveat") {
          g.appendChild(
            el("path", {
              d: `M ${mx} ${my - 4.4} L ${mx + 4.4} ${my} L ${mx} ${my + 4.4} L ${mx - 4.4} ${my} Z`,
              fill: "none",
              stroke: "#1a1a1a",
              "stroke-width": 1.2,
            })
          );
        } else {
          g.appendChild(
            el("rect", {
              fill: "#1a1a1a",
              height: 7.2,
              stroke: "none",
              width: 7.2,
              x: mx - 3.6,
              y: my - 3.6,
            })
          );
        }
      }

      /* highlight ring: ground footprint, drawn only when active */
      const ring = el("path", {
        d: facePath([B.N, B.E, B.S, B.W]),
        fill: "none",
        opacity: 0,
        stroke: "#1a1a1a",
        "stroke-dasharray": "3 3",
        "stroke-width": 1.6,
      });
      ring.setAttribute("class", "ring");
      g.appendChild(ring);

      /* letter code on the top face */
      const label = el("text", {
        "font-size": d.code.length > 1 ? 17 : 21,
        "font-weight": 700,
        "letter-spacing": d.code.length > 1 ? 0 : 0.5,
        "text-anchor": "middle",
        x: d.apex[0],
        y: d.apex[1] + (marks.length ? 2 : 6.5),
      });
      label.textContent = d.code;
      g.appendChild(label);

      /* transparent hit area covering the whole prism */
      g.appendChild(
        el("path", {
          d: facePath([T.N, T.E, B.E, B.S, B.W, T.W]),
          fill: "transparent",
          stroke: "transparent",
          "stroke-width": 6,
        })
      );

      gBlocks.appendChild(g);
      nodeEls[d.code] = { g, label, ring };

      g.addEventListener("mouseenter", () => setHover(d.code));
      g.addEventListener("mouseleave", () => setHover(null));
      g.addEventListener("focus", () => setHover(d.code));
      g.addEventListener("blur", () => setHover(null));
      g.addEventListener("click", () =>
        setSelected(selected === d.code ? null : d.code)
      );
    }

    /* ============================================================================
                   SIDEBAR
                   ========================================================================= */
    const rowEls = {};
    (function sidebar() {

    /* ============================================================================

      const cells = [["tot", DATA.length, "COMPONENTS"]];

    /* ============================================================================

        const Bs = {

        const fs = {

        const ol = OUTLINE[sk] || { dash: null, w: 1.4 };

      head1.className = "lg-item";

        "An earlier version of this pipeline reported a 651&times; druggability spread as a " +

    /* ============================================================================
                   INTERACTION
                   ========================================================================= */
    let selected = null,
      hovered = null,
      tab = "what";

    function setHover(code) {
      hovered = code;
      paint();
    }
    function setSelected(code) {
      selected = code;
      paint();
    }

    for (const b of document.querySelectorAll(".tab")) {
      b.addEventListener("click", () => {
        tab = b.getAttribute("data-tab");
        paint();
      });
    }

    function byCode(code) {
      return DATA.find((d) => d.code === code);
    }

    /* bump every declared edge of one block to the active weight */
    function emphasise(g) {
      for (const p of g.querySelectorAll('path[stroke="#1a1a1a"]')) {
        if (!p.classList.contains("ring")) {
          p.setAttribute(
            "stroke-width",
            Math.max(
              Number.parseFloat(p.getAttribute("stroke-width") || 1),
              2.2
            )
          );
        }
      }
    }

    function paintBlocks(active) {
      for (const d of DATA) {
        const n = nodeEls[d.code];
        const lit = d.code === active || d.code === selected;
        n.ring.setAttribute("opacity", lit ? 1 : 0);
        n.g.setAttribute("opacity", active && d.code !== active ? 0.34 : 1);
        n.label.setAttribute("fill", "#1a1a1a");
        if (lit) {
          emphasise(n.g);
        } else {
          /* restore declared weights */
          restoreWeights(d);
        }
      }
    }

    function paintSidebar(active) {
      for (const d of DATA) {
        const r = rowEls[d.code];
        r.classList.toggle("sel", d.code === selected);
        r.classList.toggle(
          "dim",
          !!active && d.code !== active && d.code !== selected
        );
      }
    }

    function paint() {
      const active = hovered || selected;
      for (const b of document.querySelectorAll(".tab")) {
        b.classList.toggle("on", b.getAttribute("data-tab") === tab);
      }
      paintBlocks(active);
      paintSidebar(active);
      renderPanel(active ? byCode(active) : null);
    }

    /* the paint() stroke bump is destructive, so remember the declared weights */
    const declaredWeights = {};
    for (const d of DATA) {
      declaredWeights[d.code] = [];
      for (const [i, p] of nodeEls[d.code].g
        .querySelectorAll("path")
        .entries()) {
        declaredWeights[d.code][i] = p.getAttribute("stroke-width");
      }
    }
    function restoreWeights(d) {
      for (const [i, p] of nodeEls[d.code].g
        .querySelectorAll("path")
        .entries()) {
        const w = declaredWeights[d.code][i];
        if (w === null || w === undefined) {
          p.removeAttribute("stroke-width");
        } else {
          p.setAttribute("stroke-width", w);
        }
      }
    }

    function renderPanel(d) {
      const body = document.getElementById("pbody");
      if (!d) {
        body.innerHTML =
          '<div class="p-kicker">' +
          INTRO.head +
          "</div>" +
          INTRO.body.map((p) => `<p class="p-text">${p}</p>`).join("") +
          '<hr class="p-rule thin">' +
          '<div class="p-kicker">THE TWO AXES</div>' +
          '<ul class="p-list">' +
          "<li><b>Axis 1 &mdash; retrieved precedent.</b> Looked up, not computed. The stronger axis when it exists.</li>" +
          "<li><b>Axis 2 &mdash; computed tractability.</b> Computed, with declared blind spots.</li>" +
          "<li>Never averaged. No overall number. Disagreement is reported, not resolved.</li>" +
          "</ul>" +
          '<hr class="p-rule thin">' +
          '<div class="p-kicker">WHAT THE PIPELINE HAS MEASURED ABOUT ITSELF</div>' +
          '<ul class="p-list">' +
          "<li><b>E6 &mdash; druggability does not separate; volume does.</b> AUC 0.720 (CI 0.44-0.94) " +
          "and 0.520 against volume's 1.000. MYC, with zero holo structures, medians 0.75. Persistence " +
          "is chance and ranks MYC top. The 207/242 A³ boundary is a post-hoc proposal on n=15.</li>" +
          "<li><b>P &mdash; P2Rank finds sites and must not score them.</b> 79% promoted, 1% demoted, " +
          "median rank 5 &rarr; 1, top-3 recall 37% &rarr; 91% (n=70) &mdash; but inverted as a quality " +
          "classifier it gives AUC 0.25. The one demotion, KRAS, stays on the record.</li>" +
          "<li><b>E7 &mdash; three single-case tool claims, benchmarked; all three moved.</b> Confidence " +
          "is not anti-diagnostic (pLDDT family notices on 5 of 5, 30 folds) &mdash; but <i>ligand_iptm</i> " +
          "is right on only 3 of 5 and <i>rises</i> on TNF-alpha with the site sealed. The 1.97-log " +
          "affinity error is gone: +0.23 log over 17 pairs, CI (&minus;0.28, +0.74). ESMFold's interface " +
          "failure was our input: 1 contact on the mature chain, 55 on the ordered core.</li>" +
          "<li><b>T2 &mdash; triage, not ranking.</b> Binder-vs-non-binder separates at ROC AUC 0.983 / " +
          "1.000; within-target ranking does not hold up (rho +0.48, p=0.11). The old rule was backwards.</li>" +
          "<li><b>E2 &mdash; the retrospective discriminates.</b> JAK1/2/3 and TYK2 go 0 &rarr; 2/2/1/1 " +
          "between a 2010 and a 2013 cutoff; TNF, IL6R, CD20 and IL1B stay at 0 throughout.</li>" +
          "<li><b>E5 &mdash; the two axes stay apart, and its own headline numbers were void.</b> 0.992 " +
          "against 0.735 and 4-of-4 against 2-of-4 were maxima with no minima &mdash; point estimates, " +
          "which the validator itself rejects. They live in <i>not_found</i>. The disagreement survives.</li>" +
          "<li><b>U2 &mdash; the escalation ladder is blocked.</b> BioEmu returns backbone plus C-beta " +
          "only, fpocket needs side chains, nothing repacks. <i>sampled_ensemble</i> is unreachable.</li>" +
          "<li><b>O &mdash; withdrawn.</b> The 651&times; spread was never a spread of one site.</li>" +
          "</ul>" +
          '<div class="p-hint">HOVER A BLOCK OR AN INDEX ROW TO READ IT.<br>CLICK TO PIN.</div>';
        return;
      }
      const stage = STAGES.find((s) => s.key === d.stage);
      const neg =
        d.status === "blocked" ||
        d.status === "notbuilt" ||
        d.status === "withdrawn";
      const content =
        tab === "what"
          ? '<div class="p-kicker">WHAT IT DOES</div><p class="p-text">' +
            d.what +
            "</p>"
          : '<div class="p-kicker">STATUS</div>' +
            '<div class="p-status' +
            (neg ? " neg" : "") +
            '">' +
            d.label +
            "</div>" +
            '<p class="p-text" style="margin-top:11px">' +
            d.st +
            "</p>";

      body.innerHTML =
        '<div class="p-code">' +
        d.code +
        "</div>" +
        '<div class="p-name">' +
        d.name +
        "</div>" +
        '<div class="p-stage">' +
        stage.n +
        " · " +
        stage.title +
        "</div>" +
        '<hr class="p-rule">' +
        content +
        '<hr class="p-rule thin">' +
        '<div class="p-meta">' +
        "FILL &nbsp;" +
        STATUS_META[d.status].name +
        "<br>" +
        "HEIGHT &nbsp;" +
        d.h +
        " / 68 — verification depth" +
        (d.caveat ? "<br>MARKER &nbsp;open diamond — open caveat" : "") +
        (d.corrected
          ? "<br>MARKER &nbsp;solid square — corrected after a wrong answer"
          : "") +
        (d.status === "withdrawn"
          ? "<br>MARKER &nbsp;struck faces — finding retracted"
          : "") +
        "</div>";
    }

    paint();

    /* keyboard: escape unpins */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        setSelected(null);
      }
    });
    </script>
  </body>
</html>
