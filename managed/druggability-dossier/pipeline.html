<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRUGGABILITY DOSSIER — PIPELINE STATE</title>
<style>

    --bg:#d7d2ac;
    --ink:#1a1a1a;

    border-bottom:2px solid var(--ink);

  .count{
    padding:5px 11px 6px 11px;
    border-right:1px solid var(--ink);
    text-align:center;
    min-width:74px;
  }
  .count:last-child{border-right:0;}
  .count .n{font-size:18px;font-weight:700;line-height:1.1;display:block;}
  .count .k{font-size:9px;letter-spacing:0.1em;color:var(--ink-70);white-space:nowrap;}
  .count.tot{background:var(--ink);}
  .count.tot .n{color:var(--bg);}

  /* ---------- layout ---------- */
  .wrap{
    display:grid;
    grid-template-columns:290px minmax(0,1fr) 340px;
    align-items:stretch;
    height:calc(100vh - 62px);
    min-height:720px;
  }
  .col{overflow-y:auto;overflow-x:hidden;}
  .col::-webkit-scrollbar{width:9px;}
  .col::-webkit-scrollbar-thumb{background:var(--ink-22);}
  .col::-webkit-scrollbar-track{background:transparent;}

  /* ---------- sidebar ---------- */
  #sidebar{border-right:1px solid var(--ink);}
  .side-head{
    padding:9px 12px 8px 12px;
    border-bottom:1px solid var(--ink);
    font-size:9.5px;letter-spacing:0.16em;color:var(--ink-70);
    display:flex;justify-content:space-between;
    position:sticky;top:0;background:var(--bg);z-index:3;
  }
  .grp{border-bottom:1px solid var(--ink-22);}
  .grp-head{padding:9px 12px 2px 12px;}
  .grp-name{font-size:10.5px;letter-spacing:0.15em;font-weight:700;}
  .grp-note{font-size:9.5px;color:var(--ink-45);letter-spacing:0.02em;line-height:1.4;margin-top:1px;}
  .grp-rows{padding:5px 0 8px 0;}
  .row{
    display:grid;
    grid-template-columns:22px 1fr 26px;
    gap:6px;
    align-items:baseline;
    padding:2px 12px 2px 12px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .row .code{
    font-size:10.5px;font-weight:700;text-align:center;
    border:1px solid var(--ink-45);line-height:14px;height:15px;
  }
  .row .nm{font-size:10.5px;letter-spacing:-0.2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .tg{font-size:8.5px;letter-spacing:0.06em;color:var(--ink-45);text-align:right;}
  .row:hover{background:var(--ink-12);}
  .row.sel{background:var(--ink);border-left-color:var(--ink);}
  .row.sel .nm,.row.sel .tg{color:var(--bg);}
  .row.sel .code{color:var(--bg);border-color:var(--bg);}

  /* ---------- diagram ---------- */
  #stage{position:relative;}
  #diagram{display:block;width:100%;height:auto;}
  .dg-foot{
    border-top:1px solid var(--ink-22);
    padding:9px 18px 16px 18px;
    display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;
  }
  .lg-item{display:flex;gap:7px;align-items:flex-start;}
  .lg-item .lt{font-size:9.5px;line-height:1.35;color:var(--ink-70);max-width:150px;}
  .lg-item .lt b{color:var(--ink);font-weight:700;display:block;letter-spacing:0.07em;font-size:9.5px;}

  .tabs{display:flex;border-bottom:1px solid var(--ink);flex:0 0 auto;}

    flex:1;padding:9px 6px;text-align:center;cursor:pointer;
    font-size:9.5px;letter-spacing:0.14em;color:var(--ink-45);
    border-right:1px solid var(--ink);background:transparent;

  }
  .tab:last-child{border-right:0;}
  .tab.on{background:var(--ink);color:var(--bg);font-weight:700;}

  .p-body::-webkit-scrollbar{width:9px;}
  .p-body::-webkit-scrollbar-thumb{background:var(--ink-22);}

<script>
/* ============================================================================
   DATA  —  edit this array to update the schematic. Everything below renders
   from it: the diagram, the sidebar index, the header counts, the panel.

   stage  : key into STAGES
   status : 'verified' | 'built' | 'partial' | 'notbuilt' | 'blocked'
            (controls block fill + sidebar tag)
   label  : the exact status string, shown verbatim. Never inferred.
   h      : block height in world units = how much verification work sits

   caveat : true -> draws the open-diamond marker on the top face
   ========================================================================= */

  { key:'prec',   n:'02', name:['PRECEDENT','AXIS'],           title:'PRECEDENT AXIS',

  { key:'struct', n:'03', name:['STRUCTURE','SELECTION'],      title:'STRUCTURE SELECTION',
    note:'' },
  { key:'pocket', n:'04', name:['POCKET','DETECTION'],         title:'POCKET DETECTION',
    note:'Modal app druggability-pocket-scan · CPU · deployed' },
  { key:'escal',  n:'05', name:['ESCALATION'],                 title:'ESCALATION',

  { key:'synth',  n:'06', name:['SYNTHESIS'],                  title:'SYNTHESIS',
    note:'' },
  { key:'eval',   n:'E',  name:['EVALUATION'],                 title:'EVALUATION',

const DATA = [
/* ---- INPUT --------------------------------------------------------------- */

  what:'The only required input is a UniProt accession. Two optional fields ride along: an as_of_date, which re-runs the whole pipeline as it would have looked on a past date, and a mechanism_hypothesis — orthosteric, allosteric, or oligomer_destabilisation — which decides what structural question gets asked downstream.',
  st:'Input contract is fixed and exercised by the fixture sets.' },

/* ---- PRECEDENT AXIS ------------------------------------------------------ */
{ code:'B', stage:'prec', name:'drugs by accession', status:'verified', h:56,
  label:'BUILT AND VERIFIED',
  what:'Pulls approved and clinical-stage drugs recorded against the accession, each with its first_approval year and annotated mechanism, out of the ChEMBL views exposed by the Paperclip CLI.',

{ code:'C', stage:'prec', name:'modality test', status:'verified', h:66,

  label:'BUILT AND VERIFIED',

  what:'mmCIF is the only structure format read anywhere in the pocket scan.',
  st:'Verified, and not a preference. Legacy PDB format cannot hold 5-character ligand codes — 9SQX’s ligand is A1JPS — and RCSB no longer issues PDB-format files for new entries.' },

  label:'BUILT AND VERIFIED',
  what:'Runs fpocket for detection with the clustering distance swept over {1.6, 2.4} rather than pinned to a single value, and reports the spread.',
  st:'Verified by counterexample. -D 1.6 reports druggability 0.002 at the site of a co-crystallised 570 Da ligand — a false negative on a holo structure, where the right answer is already known.' },

{ code:'P', stage:'pocket', name:'P2Rank / PRANK rescoring', status:'built', h:48, caveat:true,
  label:'BUILT, DEPLOY VERIFICATION PENDING',
  what:'fpocket detects, PRANK ranks — ligandability ordering from a learned model instead of from fpocket’s own score.',
  st:'Works locally: on 6OIM the switch-II pocket moves from fpocket rank 9 to PRANK rank 2. Not yet verified in the deployed image.' },

  label:'NOT BUILT',
  what:'Measures pocket density over aligned frames of an ensemble, instead of detecting pockets independently per structure and matching them after the fact. This is the principled fix for O’s caveat.',
  st:'Not built. It ships with fpocket and is already present in the deployed image, so the blocker here is code, not infrastructure.' },

{ code:'R', stage:'pocket', name:'cryptic mechanism classification', status:'notbuilt', h:12,
  label:'NOT BUILT',
  what:'Superposes holo on apo, measures C-alpha displacement, and attributes the clash — separating backbone collapse (KRAS, 8.8 A) from side-chain or subunit occlusion (TNF-alpha, 1.62 A).',
  st:'Not built. The rules are written and the numbers exist in calibration scripts, but there is no pipeline code. It matters because loop-motion sites reach nanomolar and side-chain-occluded sites do not.' },

{ code:'S', stage:'pocket', name:'pocket vs interface classification', status:'notbuilt', h:8,
  label:'NOT BUILT',
  what:'Labels each pocket orthosteric, allosteric, or destabiliser by overlapping its residues with computed protein-protein interface residues — the check that ties a pocket back to the input mechanism_hypothesis.',
  st:'Not built.' },

/* ---- ESCALATION ---------------------------------------------------------- */
{ code:'T', stage:'escal', name:'Boltz-2 affinity positive control', status:'blocked', h:12,
  label:'BLOCKED',
  what:'Before trusting any predicted affinity, run the predictor on the target’s own best-known binder. Every affinity number then ships with a per-target reliability estimate instead of as a bare score.',
  st:'Blocked on an external dependency: a Modal payment method. H100/H200/A100 are gated behind a card regardless of credit balance.' },

{ code:'U', stage:'escal', name:'bioemu conformational ensembles', status:'blocked', h:18,
  label:'BLOCKED',
  what:'Generates conformational ensembles from sequence, to look for cryptic pockets where no apo/holo pair exists. Monomer-only; a poly-glycine linker is the planned workaround for multimers.',

  label:'BLOCKED',
  what:'Disorder proxy and pocket-residue constraint, for targets with no usable experimental structure.',

  st:'Not built. metapredict is the right tool — MIT-licensed, and it separates MYC at 0.828 from folded controls at 0.015 — but it fails to build a wheel in the image.' },

{ code:'X', stage:'synth', name:'falsification sweep', status:'partial', h:18,
  label:'PARTIAL',
  what:'Seven adversarial checks run against the assembled evidence before anything is reported: single-assay dominance, uncharacterised potency assay, single-series actives, frequent-hitter holo ligand, one-crystal-form pocket, accession mis-mapping, terminated programs. Checks that find nothing are recorded too.',

  what:'The output contract: the two axes reported separately and never averaged, four precedent blocks kept distinct, and an explicit insufficient_evidence state instead of a defaulted score.',
  st:'Template written. Assembly has never been run end to end.' },

  label:'NOT BUILT',
  what:'Compile the working prototype session into a deployed Claude Managed Agent via /managed-agent-deploy.',
  st:'Not built.' },

{ code:'E1', stage:'eval', name:'RA fixture set', status:'built', h:38,
  label:'BUILT',
  what:'Eight rheumatoid arthritis targets, holding disease constant. JAK1, JAK2, JAK3 and TYK2 went to small molecules; TNF, IL6R, CD20 and IL1B went to biologics only. One disease, and the only variable left is which modality won.',
  st:'Built. Used as the ground truth for B, C, D and E.' },

{ code:'E2', stage:'eval', name:'as-of retrospective', status:'partial', h:24,
  label:'BUILT (FIXTURE), NOT RUN',
  what:'Re-runs the fixture set at 2010-12-31, when RA reads biologic-only across every target. The JAK rows must flip between 2010 and 2013, or the as-of machinery is not actually doing anything.',
  st:'The fixture is built. The retrospective has not been run.' },

{ code:'E3', stage:'eval', name:'calibration fixtures', status:'verified', h:60,
  label:'BUILT AND VERIFIED',
  what:'The structures the pocket scan is calibrated against: KRAS holo/apo, a five-structure TNF-alpha apo ensemble, and IL-17A failure modes.',

const STATUS_META = {
  verified: { tag:'VER', name:'BUILT AND VERIFIED',            hatch:3.6  },
  built:    { tag:'BLT', name:'BUILT',                         hatch:6.8  },
  partial:  { tag:'PRT', name:'PARTIAL',                       hatch:13   },
  notbuilt: { tag:'—', name:'NOT BUILT',                  hatch:null },
  blocked:  { tag:'BLK', name:'BLOCKED ON EXTERNAL DEPENDENCY',hatch:null }
};

const INTRO = {
  head:'WHAT THIS IS',
  body:[
    'This is one station in a larger evidence gauntlet. Other stations handle genetics, expression, perturbation, PK/PD, safety and clinical precedent. This one takes a protein target and reports whether it can be drugged <b>with a small molecule</b> — and nothing else.',
    'Two axes are reported separately and never averaged. <b>Retrieved precedent</b> is what has actually been made against the target: measured bioactivity, approved drugs split by modality, patents, terminated programs. <b>Computed tractability</b> is what the structure says about whether a small molecule could bind. They are allowed to disagree, and when they disagree the disagreement is the finding. There is no overall number.',
    'The hard problems here turned out to be measurement problems, not prediction problems. Almost every tall block on this schematic is tall because a plausible-looking number was wrong for a boring reason — a salt form read as a biologic, an asymmetric unit read as a dimer, a cofactor read as a ligand, one lab’s assay read as a field of evidence — and the fix was to measure the measurement, not to model harder.'
  ]
};

/* ============================================================================
   GEOMETRY  —  isometric projection
   screenX = (x - y) * cos(30)
   screenY = (x + y) * sin(30) - height
   ========================================================================= */
const C30 = Math.cos(Math.PI/6);   // 0.8660254
const S30 = Math.sin(Math.PI/6);   // 0.5

const L   = 52;     // block footprint side, world units
const HX  = 118;    // screen px between stage columns
const HXG = 56;     // extra screen px before the detached EVALUATION column
const VY  = 132;    // screen px between rows within a stage

function P(x, y, z){ return [ (x - y) * C30, (x + y) * S30 - z ]; }

/* stage column screen-x, cumulative */
const stageX = {};
(function(){
  let acc = 0;
  STAGES.forEach((s, i) => {
    if (i > 0) acc += HX + (s.detached ? HXG : 0);
    stageX[s.key] = acc;
  });
})();

/* Solve for world coords so that: stage index steps purely horizontally on
   screen, row index steps purely vertically. Both directions are still real
   moves in the world plane, so the projection above is what draws them. */
function worldFor(sKey, row){
  const u = stageX[sKey] / (2 * C30);   // (x - y)/2 component
  const w = row * VY;                   // (x + y)/2 component  (VY / (2*S30) / 2 * 2)
  return [ u + w, -u + w ];
}

/* group data by stage, keep declaration order */
const byStage = {};
STAGES.forEach(s => byStage[s.key] = []);
DATA.forEach(d => byStage[d.stage].push(d));

/* attach geometry */
DATA.forEach(d => {
  d.row = byStage[d.stage].indexOf(d);
  const [wx, wy] = worldFor(d.stage, d.row);
  d.wx = wx; d.wy = wy;
  d.base = P(wx, wy, 0);        // base centre
  d.apex = P(wx, wy, d.h);      // top-face centre
});

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  return n;
}

/* ---------- viewBox bounds ------------------------------------------------ */
const rowsMax = Math.max(...STAGES.map(s => byStage[s.key].length));
const VB = {
  x: -70,
  y: -172,
  w: stageX[STAGES[STAGES.length-1].key] + L*C30 + 140,
  h: (rowsMax-1)*VY + L*S30 + 172 + 40
};

/* ============================================================================
   DIAGRAM RENDER
   ========================================================================= */
const svg = document.getElementById('diagram');
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

/* --- defs: hatch patterns, one per (status x face) ------------------------ */
const FACES = { top:{ang:-30, tint:0}, left:{ang:30, tint:0.06}, right:{ang:90, tint:0.13} };

/* one hatch pattern per (status x face); prefix keeps ids unique per <svg> */
function makeHatchDefs(prefix){
  const defs = el('defs');
  for (const sk in STATUS_META){
    const sp = STATUS_META[sk].hatch;
    if (!sp) continue;
    for (const fk in FACES){
      const p = el('pattern', {
        id:`${prefix}-${sk}-${fk}`, patternUnits:'userSpaceOnUse',
        width:sp, height:sp, patternTransform:`rotate(${FACES[fk].ang})`
      });
      p.appendChild(el('line', {
        x1:-1, y1:sp/2, x2:sp+1, y2:sp/2,
        stroke:'#1a1a1a', 'stroke-width':0.72
      }));
      defs.appendChild(p);
    }
  }
  return defs;
}
svg.appendChild(makeHatchDefs('h'));

/* --- layer order ---------------------------------------------------------- */
const gGrid   = el('g', {id:'g-grid'});
const gFrame  = el('g', {id:'g-frame'});
const gLink   = el('g', {id:'g-link'});
const gBlocks = el('g', {id:'g-blocks'});
const gHead   = el('g', {id:'g-head'});
[gGrid,gFrame,gLink,gBlocks,gHead].forEach(g => svg.appendChild(g));

/* --- faint isometric grid ------------------------------------------------- */
(function grid(){
  const G = 26;
  // world bounds that cover the viewBox
  const corners = [[VB.x,VB.y],[VB.x+VB.w,VB.y],[VB.x,VB.y+VB.h],[VB.x+VB.w,VB.y+VB.h]];
  let xs=[], ys=[];
  corners.forEach(([sx,sy]) => {
    // invert projection at z = 0
    const x = sy/(2*S30) + sx/(2*C30);
    const y = sy/(2*S30) - sx/(2*C30);
    xs.push(x); ys.push(y);
  });
  const x0 = Math.floor(Math.min(...xs)/G)*G, x1 = Math.ceil(Math.max(...xs)/G)*G;
  const y0 = Math.floor(Math.min(...ys)/G)*G, y1 = Math.ceil(Math.max(...ys)/G)*G;
  const attrs = {stroke:'#1a1a1a','stroke-width':0.4,'stroke-opacity':0.11};
  for (let x = x0; x <= x1; x += G){
    const a = P(x, y0, 0), b = P(x, y1, 0);
    gGrid.appendChild(el('line', Object.assign({x1:a[0],y1:a[1],x2:b[0],y2:b[1]}, attrs)));
  }
  for (let y = y0; y <= y1; y += G){
    const a = P(x0, y, 0), b = P(x1, y, 0);
    gGrid.appendChild(el('line', Object.assign({x1:a[0],y1:a[1],x2:b[0],y2:b[1]}, attrs)));
  }
})();

/* --- stage headers -------------------------------------------------------- */
STAGES.forEach(s => {
  const X = stageX[s.key];
  const g = el('g', {});
  g.appendChild(el('line', {x1:X-L*C30, y1:-104, x2:X+L*C30, y2:-104,
    stroke:'#1a1a1a','stroke-width':1.4}));
  const num = el('text', {x:X-L*C30, y:-146, 'font-size':10, 'letter-spacing':1.6,
    'fill-opacity':0.5});
  num.textContent = s.n;
  g.appendChild(num);
  s.name.forEach((ln, i) => {
    const t = el('text', {x:X, y:-128 + i*15, 'text-anchor':'middle',
      'font-size':12.5, 'font-weight':700, 'letter-spacing':1.5});
    t.textContent = ln;
    g.appendChild(t);
  });
  const cnt = el('text', {x:X+L*C30, y:-146, 'text-anchor':'end',
    'font-size':10, 'fill-opacity':0.5});
  cnt.textContent = byStage[s.key].length;
  g.appendChild(cnt);
  gHead.appendChild(g);
});

/* --- detached-evaluation divider ------------------------------------------ */
(function divider(){
  const evalS = STAGES.find(s => s.detached);
  if (!evalS) return;
  const prev = STAGES[STAGES.indexOf(evalS)-1];
  const dx = (stageX[evalS.key] + stageX[prev.key]) / 2;
  const yTop = -164, yBot = (rowsMax-1)*VY + L*S30 + 24;
  gFrame.appendChild(el('line', {x1:dx, y1:yTop, x2:dx, y2:yBot,
    stroke:'#1a1a1a','stroke-width':0.9,'stroke-dasharray':'5 5','stroke-opacity':0.55}));
  const t = el('text', {x:dx-8, y:yBot-4, 'text-anchor':'end',
    'font-size':9.5, 'letter-spacing':1.2, 'fill-opacity':0.5});
  t.textContent = 'BESIDE THE PIPELINE, NOT IN IT →';
  gFrame.appendChild(t);
})();

/* --- connectors: intra-stage rails + inter-stage spine -------------------- */
function diamond(x, y, r, filled){
  return el('path', {
    d:`M ${x} ${y-r} L ${x+r} ${y} L ${x} ${y+r} L ${x-r} ${y} Z`,
    fill: filled ? '#1a1a1a' : '#d7d2ac',
    stroke:'#1a1a1a', 'stroke-width':1
  });
}
STAGES.forEach((s, si) => {
  const list = byStage[s.key];
  const X = stageX[s.key];
  /* vertical rail through the column, behind the blocks */
  for (let r = 0; r < list.length - 1; r++){
    const yA = r*VY + L*S30;
    const yB = (r+1)*VY - L*S30 - list[r+1].h;
    gLink.appendChild(el('line', {x1:X, y1:r*VY, x2:X, y2:(r+1)*VY,
      stroke:'#1a1a1a','stroke-width':1.1,'stroke-opacity':0.75}));
    if (yB - yA > 11) gLink.appendChild(diamond(X, (yA+yB)/2, 3.6, false));
  }
  /* horizontal spine to the next stage, at row 0 ground level */
  const next = STAGES[si+1];
  if (next && !next.detached){
    const x1 = X + L*C30, x2 = stageX[next.key] - L*C30;
    gLink.appendChild(el('line', {x1, y1:0, x2, y2:0,
      stroke:'#1a1a1a','stroke-width':1.3}));
    gLink.appendChild(diamond((x1+x2)/2, 0, 4.2, false));
  }
});

/* --- blocks --------------------------------------------------------------- */
const nodeEls = {};

function facePath(pts){ return 'M ' + pts.map(p => p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' L ') + ' Z'; }

DATA.forEach(d => {
  const { wx, wy, h } = d;
  const half = L/2;
  const T = {                                   // top face corners, z = h
    N:P(wx-half, wy-half, h), E:P(wx+half, wy-half, h),
    S:P(wx+half, wy+half, h), W:P(wx-half, wy+half, h)
  };
  const B = {                                   // base corners, z = 0
    N:P(wx-half, wy-half, 0), E:P(wx+half, wy-half, 0),
    S:P(wx+half, wy+half, 0), W:P(wx-half, wy+half, 0)
  };
  const faces = {
    top:   [T.N, T.E, T.S, T.W],
    left:  [T.W, T.S, B.S, B.W],
    right: [T.S, T.E, B.E, B.S]
  };

  const g = el('g', {class:'block', 'data-code':d.code, tabindex:'0'});
  const meta = STATUS_META[d.status];
  const dashed = (d.status === 'notbuilt');

  for (const fk in faces){
    const pth = facePath(faces[fk]);
    /* opaque base so the grid does not read through the block */
    g.appendChild(el('path', {d:pth, fill:'#d7d2ac', stroke:'none'}));
    if (FACES[fk].tint > 0)
      g.appendChild(el('path', {d:pth, fill:'#1a1a1a', 'fill-opacity':FACES[fk].tint, stroke:'none'}));
    if (meta.hatch)
      g.appendChild(el('path', {d:pth, fill:`url(#h-${d.status}-${fk})`, stroke:'none'}));
    g.appendChild(el('path', {
      d:pth, fill:'none', stroke:'#1a1a1a',
      'stroke-width': dashed ? 1 : 1.5,
      'stroke-dasharray': dashed ? '4 3' : null,
      'stroke-linejoin':'miter'
    }));
  }

  /* BLOCKED marker: heavy front edges + solid joint at the front corner */
  if (d.status === 'blocked'){
    g.appendChild(el('path', {
      d:`M ${T.W[0]} ${T.W[1]} L ${T.S[0]} ${T.S[1]} L ${T.E[0]} ${T.E[1]}`,
      fill:'none', stroke:'#1a1a1a', 'stroke-width':3.4, 'stroke-linejoin':'miter'
    }));
    g.appendChild(diamond(T.S[0], T.S[1], 4.6, true));
  }

  /* open-caveat marker */
  if (d.caveat){
    g.appendChild(el('path', {
      d:`M ${d.apex[0]} ${d.apex[1]-15} L ${d.apex[0]+4.6} ${d.apex[1]-10.4} L ${d.apex[0]} ${d.apex[1]-5.8} L ${d.apex[0]-4.6} ${d.apex[1]-10.4} Z`,
      fill:'none', stroke:'#1a1a1a', 'stroke-width':1.2
    }));
  }

  /* highlight ring: ground footprint, drawn only when active */
  const ring = el('path', {
    d: facePath([B.N, B.E, B.S, B.W]),
    fill:'none', stroke:'#1a1a1a', 'stroke-width':1.6,
    'stroke-dasharray':'3 3', opacity:0
  });
  ring.setAttribute('class','ring');
  g.appendChild(ring);

  /* letter code on the top face */
  const label = el('text', {
    x:d.apex[0], y:d.apex[1] + (d.caveat ? 8.5 : 6.5),
    'text-anchor':'middle',
    'font-size': d.code.length > 1 ? 17 : 21,
    'font-weight':700, 'letter-spacing': d.code.length > 1 ? 0 : 0.5
  });
  label.textContent = d.code;
  g.appendChild(label);

  /* transparent hit area covering the whole prism */
  g.appendChild(el('path', {
    d: facePath([T.N, T.E, B.E, B.S, B.W, T.W]),
    fill:'transparent', stroke:'transparent', 'stroke-width':6
  }));

  gBlocks.appendChild(g);
  nodeEls[d.code] = { g, ring, label };

  g.addEventListener('mouseenter', () => setHover(d.code));
  g.addEventListener('mouseleave', () => setHover(null));
  g.addEventListener('focus',      () => setHover(d.code));
  g.addEventListener('blur',       () => setHover(null));
  g.addEventListener('click',      () => setSelected(selected === d.code ? null : d.code));
});

/* ============================================================================
   SIDEBAR
   ========================================================================= */
const rowEls = {};
(function sidebar(){
  const sb = document.getElementById('sidebar');
  const head = document.createElement('div');
  head.className = 'side-head';
  head.innerHTML = '<span>COMPONENT INDEX</span><span>' + DATA.length + '</span>';
  sb.appendChild(head);

  STAGES.forEach(s => {
    const g = document.createElement('div'); g.className = 'grp';
    const h = document.createElement('div'); h.className = 'grp-head';
    h.innerHTML = '<div class="grp-name">' + s.n + ' · ' + s.title + '</div>' +
                  (s.note ? '<div class="grp-note">' + s.note + '</div>' : '');
    g.appendChild(h);
    const rows = document.createElement('div'); rows.className = 'grp-rows';
    byStage[s.key].forEach(d => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = '<span class="code">' + d.code + '</span>' +
                    '<span class="nm" title="' + d.name + '">' + d.name + '</span>' +
                    '<span class="tg">' + STATUS_META[d.status].tag + '</span>';
      r.addEventListener('mouseenter', () => setHover(d.code));
      r.addEventListener('mouseleave', () => setHover(null));
      r.addEventListener('click', () => setSelected(selected === d.code ? null : d.code));
      rows.appendChild(r);
      rowEls[d.code] = r;
    });
    g.appendChild(rows);
    sb.appendChild(g);
  });
})();

/* ============================================================================
   HEADER COUNTS
   ========================================================================= */
(function counts(){
  const c = {};
  DATA.forEach(d => c[d.status] = (c[d.status]||0) + 1);
  const cells = [
    ['tot', DATA.length,       'COMPONENTS'],
    ['',    c.verified||0,     'VERIFIED'],
    ['',    c.built||0,        'BUILT'],
    ['',    c.partial||0,      'PARTIAL'],
    ['',    c.notbuilt||0,     'NOT BUILT'],
    ['',    c.blocked||0,      'BLOCKED'],
    ['',    STAGES.length,     'STAGES']
  ];
  document.getElementById('counts').innerHTML = cells.map(([cls,n,k]) =>
    '<div class="count ' + cls + '"><span class="n">' + n + '</span>' +
    '<span class="k">' + k + '</span></div>').join('');
})();

/* ============================================================================
   LEGEND  (small isometric swatches, generated the same way as the blocks)
   ========================================================================= */
(function legend(){
  const items = [
    ['verified', 'BUILT AND VERIFIED', 'Dense hatch. A counterexample was found, fixed, and re-tested.'],
    ['built',    'BUILT',              'Medium hatch. Working; not adversarially tested.'],
    ['partial',  'PARTIAL',            'Sparse hatch. Written or working, not wired in or never run.'],
    ['notbuilt', 'NOT BUILT',          'Outline, dashed edges. No pipeline code exists.'],
    ['blocked',  'BLOCKED',            'Outline, heavy front edge, solid joint. External dependency.']
  ];
  const box = document.getElementById('legend');
  items.forEach(([sk, nm, txt]) => {
    const wrap = document.createElement('div');
    wrap.className = 'lg-item';
    const s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('width', 52); s.setAttribute('height', 44);
    s.setAttribute('viewBox', '-24 -30 52 44');
    /* own defs so the swatch does not depend on cross-<svg> id resolution */
    const pfx = 'lg' + sk;
    s.appendChild(makeHatchDefs(pfx));
    const hh = 16, ll = 15, hf = ll/2;
    const T = { N:P(-hf,-hf,hh), E:P(hf,-hf,hh), S:P(hf,hf,hh), W:P(-hf,hf,hh) };
    const Bs= { N:P(-hf,-hf,0),  E:P(hf,-hf,0),  S:P(hf,hf,0),  W:P(-hf,hf,0) };
    const fs = { top:[T.N,T.E,T.S,T.W], left:[T.W,T.S,Bs.S,Bs.W], right:[T.S,T.E,Bs.E,Bs.S] };
    const dashed = sk === 'notbuilt';
    for (const fk in fs){
      const p = facePath(fs[fk]);
      s.appendChild(el('path',{d:p, fill:'#d7d2ac'}));
      if (FACES[fk].tint>0) s.appendChild(el('path',{d:p, fill:'#1a1a1a','fill-opacity':FACES[fk].tint}));
      if (STATUS_META[sk].hatch) s.appendChild(el('path',{d:p, fill:`url(#h-${sk}-${fk})`}));
      s.appendChild(el('path',{d:p, fill:'none', stroke:'#1a1a1a',
        'stroke-width':dashed?1:1.4, 'stroke-dasharray':dashed?'4 3':null}));
    }
    if (sk === 'blocked'){
      s.appendChild(el('path',{d:`M ${T.W[0]} ${T.W[1]} L ${T.S[0]} ${T.S[1]} L ${T.E[0]} ${T.E[1]}`,
        fill:'none', stroke:'#1a1a1a','stroke-width':3}));
      s.appendChild(diamond(T.S[0], T.S[1], 4, true));
    }
    wrap.appendChild(s);
    const t = document.createElement('div');
    t.className = 'lt';
    t.innerHTML = '<b>' + nm + '</b>' + txt;
    wrap.appendChild(t);
    box.appendChild(wrap);
  });
  const extra = document.createElement('div');
  extra.className = 'lg-item';
  extra.innerHTML =
    '<div class="lt" style="max-width:230px"><b>READING THE SCHEMATIC</b>' +
    'Block height is verification work, not importance. Tall blocks are tall because ' +
    'something was measured, broke, and was re-measured. Open diamond on a top face ' +
    '= built with an open caveat. Small diamonds on the connectors are stage joints.</div>';
  box.appendChild(extra);
})();

/* ============================================================================
   INTERACTION
   ========================================================================= */
let selected = null, hovered = null, tab = 'what';

function setHover(code){ hovered = code; paint(); }
function setSelected(code){ selected = code; paint(); }

document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => { tab = b.dataset.tab; paint(); });
});

function byCode(code){ return DATA.find(d => d.code === code); }

function paint(){
  const active = hovered || selected;

  /* tabs */
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === tab));

  /* blocks */
  DATA.forEach(d => {
    const n = nodeEls[d.code];
    const isActive = (d.code === active);
    const isSel    = (d.code === selected);
    n.ring.setAttribute('opacity', (isActive || isSel) ? 1 : 0);
    n.g.setAttribute('opacity', (active && !isActive) ? 0.34 : 1);
    n.label.setAttribute('fill', '#1a1a1a');
    if (isActive || isSel){
      n.g.querySelectorAll('path[stroke="#1a1a1a"]').forEach(p => {
        if (!p.classList.contains('ring')) p.setAttribute('stroke-width',
          Math.max(parseFloat(p.getAttribute('stroke-width')||1) , 2.2));
      });
    } else {
      /* restore declared weights */
      restoreWeights(d);
    }
  });

  /* sidebar */
  DATA.forEach(d => {
    const r = rowEls[d.code];
    r.classList.toggle('sel', d.code === selected);
    r.classList.toggle('dim', !!active && d.code !== active && d.code !== selected);
  });

  renderPanel(active ? byCode(active) : null);
}

/* the paint() stroke bump is destructive, so remember the declared weights */
const declaredWeights = {};
DATA.forEach(d => {
  declaredWeights[d.code] = [];
  nodeEls[d.code].g.querySelectorAll('path').forEach((p, i) => {
    declaredWeights[d.code][i] = p.getAttribute('stroke-width');
  });
});
function restoreWeights(d){
  nodeEls[d.code].g.querySelectorAll('path').forEach((p, i) => {
    const w = declaredWeights[d.code][i];
    if (w === null || w === undefined) p.removeAttribute('stroke-width');
    else p.setAttribute('stroke-width', w);
  });
}

function renderPanel(d){
  const body = document.getElementById('pbody');
  if (!d){
    body.innerHTML =
      '<div class="p-kicker">' + INTRO.head + '</div>' +
      INTRO.body.map(p => '<p class="p-text">' + p + '</p>').join('') +
      '<hr class="p-rule thin">' +
      '<div class="p-kicker">THE TWO AXES</div>' +
      '<ul class="p-list">' +
        '<li><b>Axis 1 &mdash; retrieved precedent.</b> Looked up, not computed. The stronger axis when it exists.</li>' +
        '<li><b>Axis 2 &mdash; computed tractability.</b> Computed, with declared blind spots.</li>' +
        '<li>Never averaged. No overall number. Disagreement is reported, not resolved.</li>' +
      '</ul>' +
      '<div class="p-hint">HOVER A BLOCK OR AN INDEX ROW TO READ IT.<br>CLICK TO PIN.</div>';
    return;
  }
  const stage = STAGES.find(s => s.key === d.stage);
  const neg = (d.status === 'blocked' || d.status === 'notbuilt');
  const content = (tab === 'what')
    ? '<div class="p-kicker">WHAT IT DOES</div><p class="p-text">' + d.what + '</p>'
    : '<div class="p-kicker">STATUS</div>' +
      '<div class="p-status' + (neg ? ' neg' : '') + '">' + d.label + '</div>' +
      '<p class="p-text" style="margin-top:11px">' + d.st + '</p>';

  body.innerHTML =
    '<div class="p-code">' + d.code + '</div>' +
    '<div class="p-name">' + d.name + '</div>' +
    '<div class="p-stage">' + stage.n + ' · ' + stage.title + '</div>' +
    '<hr class="p-rule">' +
    content +
    '<hr class="p-rule thin">' +
    '<div class="p-meta">' +
      'FILL &nbsp;' + STATUS_META[d.status].name + '<br>' +
      'HEIGHT &nbsp;' + d.h + ' / 68 — verification depth' +
      (d.caveat ? '<br>MARKER &nbsp;open caveat' : '') +
    '</div>';
}

paint();

/* keyboard: escape unpins */
document.addEventListener('keydown', e => { if (e.key === 'Escape') setSelected(null); });
</script>
</body>
</html>
